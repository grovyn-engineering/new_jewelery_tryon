services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurevya_combined_app
    env_file:
      - .env
    environment:
      - PORT=8000
      - ALLOWED_ORIGINS=*
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aurevya-app.rule=Host(`Jewel.grovyn.in`)"
      - "traefik.http.routers.aurevya-app.entrypoints=websecure"
      - "traefik.http.routers.aurevya-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.aurevya-app.loadbalancer.server.port=8000"
