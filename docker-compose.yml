services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurevya_combined_app
    env_file:
      - .env
    environment:
      - PORT=8000
      - ALLOWED_ORIGINS=*
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
