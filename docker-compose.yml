services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aurevya_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - ALLOWED_ORIGINS=*
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aurevya_frontend
    ports:
      - "8443:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
